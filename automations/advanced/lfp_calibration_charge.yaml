alias: "GoodWe ESA: LFP SOC calibration tracker"
description: >
  LFP cells have a famously flat voltage curve, which makes voltage-based SOC
  estimation drift over weeks of partial cycling. Periodic full charges reset
  the BMS coulomb counter and keep your SOC reading honest. GoodWe doesn't
  publish a calibration interval for the ESA (the user manual we checked has
  none), so 14 days is a conservative house rule rather than a GoodWe figure.
  If your free-window charge reaches 100% most days this barely matters, but
  if you cap the daily charge below 100%, you're on a different plan, or
  you've been away with the system on hold, a tracker like this catches
  drift before the SOC reading becomes unreliable.

  Want it to fix the drift instead of just telling you? See
  battery_soc_cap_manager.yaml, which forces the calibration charge itself
  inside the free window (experimental HACS integration required).

  This automation has two parts:
    1. When SOC hits 100%, record the timestamp.
    2. If 14 days have passed without hitting 100%, fire a notification
       suggesting a manual top-up (or, optionally, trigger one automatically
       via a force-charge automation).

mode: single

# =============================================================================
# REQUIRED HELPERS:
#
#   input_datetime.last_full_charge       - when SOC last hit 100%.
#                                           Has date AND time enabled.
#                                           Initialise to a recent date so the
#                                           14-day timer doesn't fire on day one.
#   input_number.lfp_calibration_days     - threshold in days for the alert.
#                                           Default 14. Min 7, max 60, step 1.
# =============================================================================

triggers:
  # Track full charges
  - trigger: numeric_state
    entity_id: sensor.goodwe_battery_state_of_charge   # EDIT: your SOC sensor
    above: 99.5   # call 100% anything 99.5% or above to handle BMS rounding
    id: hit_full

  # Daily drift check at 09:00
  - trigger: time
    at: "09:00:00"
    id: daily_check

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: hit_full
        sequence:
          # Use the timestamp parameter (Unix seconds) rather than a formatted
          # string. Formatted strings come out timezone-naive, which then crashes
          # the daily check below when subtracted from a timezone-aware now().
          # The timestamp attribute of input_datetime is also Unix seconds, so
          # the read side and the write side stay in the same numeric space.
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.last_full_charge
            data:
              timestamp: "{{ now().timestamp() }}"

      - conditions:
          - condition: trigger
            id: daily_check
          - condition: template
            value_template: >
              {% set last = state_attr('input_datetime.last_full_charge', 'timestamp') %}
              {% set threshold = states('input_number.lfp_calibration_days') | float(14) %}
              {% if last == None %}
                false
              {% else %}
                {{ (now().timestamp() - last) / 86400 > threshold }}
              {% endif %}
        sequence:
          - action: notify.mobile_app_your_device_name   # EDIT: your notify service
            data:
              title: LFP calibration suggested
              message: >-
                {% set last = state_attr('input_datetime.last_full_charge', 'timestamp') %}
                {% set days = ((now().timestamp() - last) / 86400) | round(0) %}
                Battery hasn't hit 100% in {{ days }} days. Consider a manual
                full-charge tonight to keep SOC readings accurate.
