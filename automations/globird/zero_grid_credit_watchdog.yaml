alias: "GoodWe ESA: Zero Hero Daily Credit Watchdog"
description: >
  GloBird's Zero-Grid daily credit (~$1) is forfeit if peak-window grid
  imports exceed the ZEROHERO Threshold, stated in the current welcome
  pack as "0.03 kWh/Hour". Note the unit: it's a PER-HOUR cap, assessed
  from your meter's interval data - not a single budget for the whole
  window. So this watchdog measures exactly what the bill measures: grid
  import in the current clock hour, via an hourly-cycling utility meter.
  It fires an early warning once the hour's import crosses your alert
  threshold (default 0.02 kWh, two-thirds of the limit), giving you a
  chance to shed heavy loads before the hour is actually lost.

  The cap is a tolerance, not a zero-import requirement - a fridge
  compressor cycling on briefly is fine; the kettle plus the dryer plus
  the oven all on at once, blowing past your inverter's discharge cap,
  is not. Most likely to fire on skip-export nights when the battery
  started low, or when a load spike exceeds the inverter's output.

mode: single

# =============================================================================
# REQUIRED HELPERS / CONFIG (create these before enabling):
#
#   1. utility_meter -> sensor.zero_hero_grid_import_hourly
#      - Source: sensor.goodwe_meter_total_energy_import (or your equivalent -
#        use the METER import sensor, not the inverter's total_energy_import.
#        The credit is settled from meter data at your NMI, and the two
#        sensors genuinely diverge; same meter-vs-inverter story as the
#        export side, see sensors/README.md.)
#      - Cycle: hourly (no offset - the plan's cap is per clock hour)
#
#   2. input_number.zero_hero_credit_alert_threshold
#      - Min 0, max 0.03, step 0.005, unit kWh
#      - Note: HA's helper UI doesn't have an "initial value" field. Create
#        the helper, then set its value from the helper page.
#      - Starting value to set: 0.02 (kWh imported in the current clock hour.
#        GloBird's limit is 0.03 kWh/hour; alerting at 0.02 gives you a
#        real warning margin while ignoring ordinary standby wobble. If it
#        keeps tripping on uneventful nights, you're either genuinely close
#        to the limit or your meter sensor is noisy - check the history
#        before raising it. Source: GloBird ZEROHERO welcome pack, current
#        at time of writing - check your own pack.)
#
# Utility meter setup via the UI: Settings > Devices & services > Helpers >
# Create Helper > Utility Meter, source = your meter import sensor, reset
# cycle = hourly. Or in configuration.yaml:
#   utility_meter:
#     zero_hero_grid_import_hourly:
#       source: sensor.goodwe_meter_total_energy_import   # EDIT: your METER import sensor
#       cycle: hourly
# =============================================================================

triggers:
  # The hourly meter resets to 0 at the top of each clock hour, so this
  # crossing trigger re-arms every hour of the window - each billed hour
  # gets its own warning.
  - trigger: numeric_state
    entity_id: sensor.zero_hero_grid_import_hourly   # EDIT: your utility_meter entity (HA names it from the helper)
    above: input_number.zero_hero_credit_alert_threshold

conditions:
  # 17:56 start matches the ESA arming margin; 21:01 covers the full final
  # billed hour of the window.
  - condition: time
    after: "17:56:00"
    before: "21:01:00"   # EDIT: change to 20:01 if your peak window ends at 20:00
  - condition: state
    entity_id: input_boolean.zero_hero_enabled   # don't fire when Zero Hero is disabled
    state: "on"

actions:
  - action: notify.mobile_app_your_device_name   # EDIT: your notify service
    data:
      title: Zero Hero Daily Credit at Risk
      message: >-
        Grid import this hour is
        {{ states('sensor.zero_hero_grid_import_hourly') | float(0) | round(3) }} kWh
        during peak (GloBird's limit is 0.03 kWh/hour). Battery may be
        running low or a heavy load is outrunning the inverter - shed
        loads now to keep tonight's $1 credit.
      data:
        push:
          interruption-level: time-sensitive
