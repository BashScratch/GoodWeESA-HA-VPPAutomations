alias: "Tesla: Peak Charge Blocker"
description: >
  Protects the Zero-Grid CREDIT window: hard-stops home charging during
  17:56-21:01 with a one-tap [Charge Anyway] override (handled by
  tesla_override_handler.yaml). The rest of the peak-RATE window
  (16:00-17:56 and 21:01-23:00) gets an informational notification only -
  no forced stop. Two triggers: (a) charging starts mid-window; (b) a
  17:56:30 sweep that catches charging which survived an HA restart
  across the window boundary. Master-gated.
mode: queued
max: 3

# =============================================================================
# WHY THIS EXISTS SEPARATELY FROM THE ORCHESTRATOR: the orchestrator's 16:00
# stop is a scheduled action - it handles the planned case. This blocker is
# event-driven: it reacts to charging *starting* mid-window (a partner plugs
# in at 19:00 without thinking about tariffs), which no schedule can catch.
#
# WHY THE HARD BLOCK ONLY COVERS 18:00-21:00 (17:56-21:01 with the arming
# margins): the credit window and the rate window are different things.
# Charging 6-9pm burns ~50c/kWh AND forfeits the $1 Zero-Grid credit - the
# most expensive electricity of the day, so the automation stops it and
# makes you tap a button to insist. Charging at 16:30 or 22:00 is merely
# expensive (peak rate, plus it drains the evening battery reserve) - that
# can be a deliberate choice before a long drive, so it earns a heads-up
# notification, not a forced stop. A blocker that nannies the whole 7-hour
# window teaches the household to ignore it.
#
# The 17:56:30 sweep time is deliberate: 30 seconds after the Zero Hero
# ESA arming check, so the two never race.
# =============================================================================

triggers:
  - trigger: state
    entity_id: sensor.yourcar_charging   # EDIT: your car's charging state sensor
    to: charging
    id: charge_started
  - trigger: time
    at: "17:56:30"
    id: sweep

conditions:
  - condition: state
    entity_id: input_boolean.tesla_orchestrator_enabled
    state: "on"
  - condition: state
    entity_id: device_tracker.yourcar_location   # EDIT: your car's device tracker
    state: home
  # Only act when Zero Hero is actually running tonight - if you've paused
  # the whole export/credit system, there's no credit to protect.
  - condition: state
    entity_id: input_boolean.zero_hero_enabled
    state: "on"
  - condition: state
    entity_id: input_boolean.tesla_charge_override
    state: "off"
  - condition: template
    value_template: "{{ states('sensor.yourcar_charging') == 'charging' }}"

actions:
  - choose:

      # HARD BLOCK - the credit window. Stop, then offer the override.
      - conditions:
          - condition: time
            after: "17:56:00"   # EDIT: credit window +/- the ESA arming margins (Zero Hero: 18:00-21:00)
            before: "21:01:00"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.yourcar_charge   # EDIT: your car's charge switch
            continue_on_error: true
          # The peak-rate label renders from the cost-tracking helper so it
          # stays current when GloBird moves the rates (falls back to the
          # July 2026 QLD figure if you haven't created the helper).
          - action: notify.mobile_app_your_device_name   # EDIT: your notify service
            data:
              title: Tesla Peak Charging Stopped
              message: >-
                Tesla started charging during the credit window (6-9pm) -
                charging stopped to protect the $1 credit and avoid
                {{ '%g' | format(states('input_number.globird_import_peak')|float(0.506)*100) }}c/kWh
                import. Tap Charge Anyway if this is deliberate.
              data:
                actions:
                  - action: TESLA_CHARGE_ANYWAY
                    title: Charge Anyway
                push:
                  sound:
                    name: default
                tag: tesla_peak_block
          # Duplicate the notify block above for each additional phone in
          # the household - everyone should get the [Charge Anyway] button,
          # since the person who plugged in usually isn't the person
          # running HA.

      # INFO ONLY - the rest of the peak-rate window. Expensive, but that
      # can be a deliberate choice; notify and leave the charge alone.
      - conditions:
          - condition: or
            conditions:
              - condition: time
                after: "16:00:00"   # EDIT: peak-rate window start (Zero Hero QLD: 16:00)
                before: "17:56:00"
              - condition: time
                after: "21:01:00"
                before: "23:00:00"   # EDIT: peak-rate window end (Zero Hero QLD: 23:00)
        sequence:
          - action: notify.mobile_app_your_device_name   # EDIT: your notify service
            data:
              title: Tesla Charging at Peak Rate
              message: >-
                Heads up: the car is charging during the peak-rate window
                (grid import costs
                {{ '%g' | format(states('input_number.globird_import_peak')|float(0.506)*100) }}c/kWh
                and battery drain cuts into the evening reserve). Not
                stopped - the hard block only covers 6-9pm. Stop it from
                the app if unintended.
              data:
                tag: tesla_peak_info
